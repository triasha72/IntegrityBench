[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "integritybench"
version = "0.1.0"
description = "A controlled benchmark for policy-conditioned content moderation."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
real-data = ["joblib>=1.4,<2", "pyarrow>=17,<22", "scikit-learn>=1.5,<2"]
transformer = [
  "accelerate>=1.0,<2",
  "torch>=2.4,<3",
  "transformers>=4.45,<6",
]
api = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]
cloud = ["boto3>=1.35,<2"]
observability = [
  "opentelemetry-exporter-otlp>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-sdk>=1.27,<2",
]

[project.scripts]
integritybench-registry = "integritybench.registry_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
