name: Review AWS deployment plan

on:
  workflow_dispatch:
    inputs:
      image_identifier:
        description: Immutable ECR image URI
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE }}
          aws-region: us-east-1
      - run: terraform -chdir=infra/terraform init
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform validate
      - name: Produce reviewable plan only
        run: |
          terraform -chdir=infra/terraform plan \
            -var='image_identifier=${{ inputs.image_identifier }}' \
            -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: infra/terraform/tfplan
          retention-days: 7
