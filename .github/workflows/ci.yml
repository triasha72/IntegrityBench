name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,real-data]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      - name: Regenerate frozen artifacts
        run: |
          python scripts/build_benchmark.py
          python scripts/build_annotation_pack.py
          python scripts/run_benchmark.py
          git diff --exit-code -- data/ artifacts/
      - name: Revalidate real-model release decision
        run: |
          python scripts/assess_civil_comments_release.py \
            artifacts/civil_comments_baseline_v1.json \
            /tmp/civil_comments_release_assessment.json
          diff -u artifacts/civil_comments_release_assessment_v1.json \
            /tmp/civil_comments_release_assessment.json
